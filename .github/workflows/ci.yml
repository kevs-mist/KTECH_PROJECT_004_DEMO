name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run all tests with coverage
        run: flutter test --coverage

      - name: Enforce 50 percent line coverage
        if: success()
        run: python3 scripts/check_coverage.py coverage/lcov.info --threshold 50

      - name: Upload LCOV coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  macos-build:
    name: macos-build
    runs-on: macos-latest
    needs: tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Create macOS app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r ktech_project_004-macos.zip ktech_project_004.app

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ktech-project-004-macos
          path: build/macos/Build/Products/Release/ktech_project_004-macos.zip
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: windows-build
    runs-on: windows-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Build and package complete Windows bundle
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $bundlePath = "build\windows\x64\runner\Release"
          $requiredPlugins = @(
            'flutter_windows.dll',
            'pdfium.dll',
            'screen_retriever_plugin.dll',
            'window_manager_plugin.dll',
            'printing_plugin.dll',
            'url_launcher_windows_plugin.dll'
          )
          $missingPlugins = @(
            $requiredPlugins | Where-Object {
              -not (Test-Path (Join-Path $bundlePath $_))
            }
          )
          if ($missingPlugins.Count -gt 0) {
            Write-Error "Windows bundle is missing plugin DLLs: $($missingPlugins -join ', ')."
            exit 1
          }
          if (-not (Test-Path (Join-Path $bundlePath 'data\flutter_assets'))) {
            Write-Error "Flutter app assets not found in '$bundlePath\data\flutter_assets'."
            exit 1
          }
          Compress-Archive -Path (Join-Path $bundlePath '*') -DestinationPath build/windows/ktech_project_004-windows-x64.zip -CompressionLevel Optimal -Force

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ktech-project-004-windows-x64
          path: build/windows/ktech_project_004-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('windows-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_type == 'tag' && format('K-TECH Registry {0}', github.ref_name) || format('K-TECH Registry Build {0}', github.run_number) }}
          generate_release_notes: true
          files: build/windows/ktech_project_004-windows-x64.zip