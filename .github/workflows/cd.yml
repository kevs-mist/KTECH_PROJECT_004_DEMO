name: CD (deployment target pending)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-placeholder:
    name: deployment-not-configured
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment status
        run: |
          echo "No deployment provider is configured. Select a target before enabling deployment."
          echo "This workflow intentionally does not publish an artifact or deploy the application."